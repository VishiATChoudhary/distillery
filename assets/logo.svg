<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 300" width="240" height="300">
  <defs>
    <linearGradient id="wine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b3123f"/>
      <stop offset="1" stop-color="#4a0418"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="stem" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9aa4b2"/>
      <stop offset="0.5" stop-color="#f4f6f8"/>
      <stop offset="1" stop-color="#7d8794"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#ff2d6f" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ff2d6f" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="bowl">
      <path d="M48 20 H192 C192 110 170 150 120 158 C70 150 48 110 48 20 Z"/>
    </clipPath>
  </defs>

  <!-- glow -->
  <ellipse cx="120" cy="90" rx="110" ry="100" fill="url(#glow)"/>

  <!-- wine inside bowl -->
  <g clip-path="url(#bowl)">
    <rect x="40" y="78" width="160" height="90" fill="url(#wine)"/>
    <!-- meniscus -->
    <ellipse cx="120" cy="78" rx="68" ry="7" fill="#d81b55" opacity="0.9"/>
    <!-- drop falling in: distillate -->
    <path d="M120 40 C126 50 128 55 128 60 A8 8 0 1 1 112 60 C112 55 114 50 120 40 Z" fill="#ff4d7d" opacity="0.95"/>
    <ellipse cx="120" cy="79" rx="12" ry="2.5" fill="#ff6f96" opacity="0.6"/>
  </g>

  <!-- bowl outline + sheen -->
  <path d="M48 20 H192 C192 110 170 150 120 158 C70 150 48 110 48 20 Z"
        fill="url(#glass)" stroke="#e9edf2" stroke-width="3" stroke-linejoin="round"/>
  <path d="M64 34 C62 80 76 120 100 138" fill="none" stroke="#ffffff" stroke-opacity="0.7" stroke-width="4" stroke-linecap="round"/>

  <!-- stem + base -->
  <rect x="114" y="158" width="12" height="90" rx="6" fill="url(#stem)"/>
  <ellipse cx="120" cy="262" rx="58" ry="12" fill="url(#stem)" stroke="#e9edf2" stroke-width="2"/>
  <ellipse cx="120" cy="258" rx="40" ry="5" fill="#ffffff" opacity="0.35"/>
</svg>
