[project]
name = "distillery"
version = "0.1.0"
description = "Autoresearch-style loop that distills an API teacher into a small open model on rented GPUs"
requires-python = ">=3.11"
dependencies = [
    "httpx",
    "torch",
    "transformers",
    "peft",
    "accelerate",
    "modal",
]

[project.optional-dependencies]
anthropic = ["anthropic"]
litellm = ["litellm"]

[tool.uv]
package = false
